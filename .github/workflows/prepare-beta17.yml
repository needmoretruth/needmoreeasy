name: Prepare beta.17

on:
  push:
    branches: [work/beta.17-nextgen]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta.17 work branch
        uses: actions/checkout@v6
        with:
          ref: work/beta.17-nextgen
          fetch-depth: 0

      - name: Install stable Rust with required tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install CPython
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Build and validate beta.17 candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = "0.0.1-beta.16"
          new = "0.0.1-beta.17"
          version_files = [
              Path("Cargo.toml"),
              Path("Cargo.lock"),
              Path("README.md"),
              Path("README.ko.md"),
              Path("docs/install.md"),
              Path("docs/install.ko.md"),
              Path("docs/versioning.md"),
              Path("docs/versioning.ko.md"),
              Path("crates/nme-cli/tests/cli.rs"),
          ]
          changed = []
          for path in version_files:
              text = path.read_text(encoding="utf-8")
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  changed.append(str(path))
          assert "Cargo.toml" in changed
          assert "Cargo.lock" in changed
          assert "crates/nme-cli/tests/cli.rs" in changed

          Path("scripts/check-beta-step.py").write_text(r'''#!/usr/bin/env python3
"""Enforce the public beta invariant: every beta commit advances exactly one beta."""
from __future__ import annotations
import re
import subprocess
import sys
import tomllib
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
VERSION_RE = re.compile(r"^(?P<base>.+-beta\.)(?P<number>\d+)$")

def fail(message: str) -> None:
    print(f"beta-step: {message}", file=sys.stderr)
    raise SystemExit(1)

def manifest_version(text: str) -> str:
    data = tomllib.loads(text)
    try:
        return data["workspace"]["package"]["version"]
    except KeyError as error:
        fail(f"Cargo.toml has no workspace.package.version: {error}")

def git(*args: str) -> str:
    return subprocess.check_output(["git", *args], cwd=ROOT, text=True).strip()

current = manifest_version((ROOT / "Cargo.toml").read_text(encoding="utf-8"))
match = VERSION_RE.fullmatch(current)
if not match:
    fail(f"current version is not a beta version: {current}")
try:
    parent_manifest = git("show", "HEAD^:Cargo.toml")
except subprocess.CalledProcessError:
    fail("beta commit needs a first parent with Cargo.toml")
parent = manifest_version(parent_manifest)
parent_match = VERSION_RE.fullmatch(parent)
if not parent_match:
    fail(f"parent version is not a beta version: {parent}")
if match.group("base") != parent_match.group("base"):
    fail(f"beta base changed unexpectedly: {parent} -> {current}")
if int(match.group("number")) != int(parent_match.group("number")) + 1:
    fail(f"beta must advance exactly one step: {parent} -> {current}")
subject = git("log", "-1", "--format=%s")
if current not in subject:
    fail(f"commit subject must contain {current!r}: {subject!r}")
lock = tomllib.loads((ROOT / "Cargo.lock").read_text(encoding="utf-8"))
workspace_packages = {"nme-cli", "nme-core", "nme-native"}
seen = set()
for package in lock.get("package", []):
    name = package.get("name")
    if name in workspace_packages:
        seen.add(name)
        if package.get("version") != current:
            fail(f"Cargo.lock {name} is {package.get('version')}, expected {current}")
if seen != workspace_packages:
    fail(f"Cargo.lock workspace packages mismatch: {sorted(seen)}")
print(f"beta-step: ok {parent} -> {current}")
''', encoding="utf-8")

          final_ci = '''name: NME CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  beta-step:
    name: beta-version-step
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    steps:
      - name: Check out NME with its parent
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Install CPython
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Enforce one beta version per beta commit
        run: python scripts/check-beta-step.py

  test:
    name: __DOLLAR__{{ matrix.os }}
    runs-on: __DOLLAR__{{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out NME
        uses: actions/checkout@v6
      - name: Install stable Rust with required tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install CPython
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Install the CLI and smoke test it
        shell: bash
        run: |
          cargo install --path crates/nme-cli --locked
          nme --version
          nme check examples/three-levels
          nme run examples/hello-sentence

  python-compat:
    name: python-__DOLLAR__{{ matrix.python-version }}
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - name: Check out NME
        uses: actions/checkout@v6
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install CPython __DOLLAR__{{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: __DOLLAR__{{ matrix.python-version }}
      - name: Test the workspace on this CPython
        run: cargo test --workspace --locked
'''.replace("__DOLLAR__", "$" + "{")
          # The replacement above produces ${{ ... }} while keeping those expressions
          # out of this preparation workflow's own expression-evaluation phase.
          Path(".github/workflows/ci.yml").write_text(final_ci, encoding="utf-8")

          en = Path("CHANGELOG.md")
          marker = "## Unreleased\n"
          entry = '''\n## 0.0.1-beta.17 — 2026-08-12\n\n- Make `beta` the enforced next-generation release line. Every public beta push now has to advance the workspace beta number by exactly one, include that version in the commit subject, and keep all workspace package versions in `Cargo.lock` synchronized.\n- Upgrade CI to the Node 24 based `actions/checkout@v6` and `actions/setup-python@v6`, and make Cargo checks/tests run with `--locked`.\n- Add a CPython compatibility matrix for 3.10, 3.12, and 3.14 on beta/PR validation, while retaining the full Ubuntu/Windows/macOS quality gate.\n'''
          text = en.read_text(encoding="utf-8")
          assert marker in text and "## 0.0.1-beta.17" not in text
          en.write_text(text.replace(marker, marker + entry, 1), encoding="utf-8")

          ko = Path("CHANGELOG.ko.md")
          marker_ko = "## 미출시 (Unreleased)\n"
          entry_ko = '''\n## 0.0.1-beta.17 — 2026-08-12\n\n- `beta`를 규칙으로 강제되는 차세대 릴리스 선으로 만들었습니다. 공개 beta push마다 workspace beta 번호가 부모보다 정확히 1 증가해야 하고, 커밋 제목에 그 버전이 들어가며, `Cargo.lock`의 모든 workspace 패키지 버전도 일치해야 합니다.\n- CI를 Node 24 기반 `actions/checkout@v6`, `actions/setup-python@v6`로 올리고 Cargo 검사와 테스트에 `--locked`를 적용했습니다.\n- beta/PR 검증에 CPython 3.10, 3.12, 3.14 호환성 매트릭스를 추가하면서 Ubuntu/Windows/macOS 전체 품질 게이트도 유지합니다.\n'''
          text = ko.read_text(encoding="utf-8")
          assert marker_ko in text and "## 0.0.1-beta.17" not in text
          ko.write_text(text.replace(marker_ko, marker_ko + entry_ko, 1), encoding="utf-8")

          Path("docs/release-beta.17.md").write_text('''# NME 0.0.1-beta.17\n\n`beta` is now the repository's next-generation release line rather than a staging copy of another branch.\n\n## Release invariants\n\n- Every commit that lands on public `beta` must move from `beta.N` to exactly `beta.N+1`.\n- The release commit subject must name the exact workspace version.\n- `Cargo.toml` and the `nme-cli`, `nme-core`, and `nme-native` entries in `Cargo.lock` must agree.\n- The beta gate checks the real first parent rather than trusting a manually supplied number.\n\n## Compatibility gate\n\nThe normal release gate still runs format, check, Clippy with warnings denied, the full workspace test suite, CLI installation, and smoke tests on Ubuntu, Windows, and macOS. Beta and pull requests also exercise the workspace against CPython 3.10, 3.12, and 3.14.\n\nThe GitHub-maintained checkout and Python setup actions are upgraded to their Node 24 based v6 lines.\n''', encoding="utf-8")
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python - <<'PY'
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          assert version == '0.0.1-beta.17'
          lock = tomllib.loads(Path('Cargo.lock').read_text())
          versions = {p['name']: p['version'] for p in lock['package'] if p['name'] in {'nme-cli','nme-core','nme-native'}}
          assert set(versions.values()) == {'0.0.1-beta.17'}, versions
          print('validated', version, versions)
          PY

      - name: Commit validated beta.17 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-beta17.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.toml Cargo.lock README.md README.ko.md docs/install.md docs/install.ko.md docs/versioning.md docs/versioning.ko.md crates/nme-cli/tests/cli.rs CHANGELOG.md CHANGELOG.ko.md docs/release-beta.17.md scripts/check-beta-step.py .github/workflows/ci.yml .github/workflows/prepare-beta17.yml
          git diff --cached --check
          git commit -m 'release: 0.0.1-beta.17 next-generation beta guard'
          git push origin HEAD:work/beta.17-nextgen
