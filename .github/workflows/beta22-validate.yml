name: beta22 release builder

on:
  push:
    branches: [work/beta22-cryptocurrency-purity]

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta22 work branch
        uses: actions/checkout@v6
        with:
          ref: work/beta22-cryptocurrency-purity
          fetch-depth: 2
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build beta22 release commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '0.0.1-beta.21'
          new = '0.0.1-beta.22'

          cargo = Path('Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit(f'Cargo.toml expected one {old}, found {text.count(old)}')
          cargo.write_text(text.replace(old, new), encoding='utf-8')

          lock = Path('Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          if text.count(old) != 3:
              raise SystemExit(f'Cargo.lock expected three workspace {old} versions, found {text.count(old)}')
          lock.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -- .github/workflows/beta22-validate.yml scripts/materialize-beta22-docs.py scripts/materialize-beta22-runtime.py
          git add -- Cargo.toml Cargo.lock
          git commit -m "release: 0.0.1-beta.22 pure six-way cryptocurrency examples"
      - name: Verify beta version step
        run: python scripts/check-beta-step.py
      - name: Verify locked workspace
        run: cargo check --workspace --locked
      - name: Push beta22 release commit to work branch
        run: git push origin HEAD:work/beta22-cryptocurrency-purity
