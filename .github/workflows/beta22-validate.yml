name: beta22 cryptocurrency validation

on:
  push:
    branches: [work/beta22-cryptocurrency-purity]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta22 work branch
        uses: actions/checkout@v6
        with:
          ref: work/beta22-cryptocurrency-purity
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install CPython
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Tune learning proof of work
        run: python scripts/materialize-beta22-runtime.py
      - name: Cryptocurrency regression tests
        run: cargo test -p nme-core --test cryptocurrency_examples --locked
      - name: Install CLI
        run: cargo install --path crates/nme-cli --locked
      - name: Check six cryptocurrency examples
        shell: bash
        run: |
          nme check examples/needmorecoin-sentence.ko
          nme check examples/needmorecoin-sentence.en
          nme check examples/needmorecoin-beginner.ko
          nme check examples/needmorecoin-beginner.en
          nme check examples/needmorecoin-advanced.ko
          nme check examples/needmorecoin-advanced.en
      - name: Run six cryptocurrency examples
        shell: bash
        run: |
          nme run examples/needmorecoin-sentence.ko
          nme run examples/needmorecoin-sentence.en
          nme run examples/needmorecoin-beginner.ko
          nme run examples/needmorecoin-beginner.en
          nme run examples/needmorecoin-advanced.ko
          nme run examples/needmorecoin-advanced.en
      - name: Commit validated examples and guides
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/guides/cryptocurrency.md docs/guides/cryptocurrency.ko.md examples/needmorecoin-sentence.ko.nme examples/needmorecoin-sentence.en.nme examples/needmorecoin-beginner.ko.nme examples/needmorecoin-beginner.en.nme examples/needmorecoin-advanced.ko.nme examples/needmorecoin-advanced.en.nme
          git commit -m "examples: validate fast six way cryptocurrency matrix"
          git push origin HEAD:work/beta22-cryptocurrency-purity
