name: beta22 cryptocurrency validation

on:
  push:
    branches: [work/beta22-cryptocurrency-purity]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta22 work branch
        uses: actions/checkout@v6
        with:
          ref: work/beta22-cryptocurrency-purity
      - name: Install stable Rust with required tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install CPython
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Materialize documentation updates
        run: python scripts/materialize-beta22-docs.py
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Workspace check
        run: cargo check --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Install CLI
        run: cargo install --path crates/nme-cli --locked
      - name: Check six cryptocurrency examples
        shell: bash
        run: |
          nme check examples/needmorecoin-sentence.ko
          nme check examples/needmorecoin-sentence.en
          nme check examples/needmorecoin-beginner.ko
          nme check examples/needmorecoin-beginner.en
          nme check examples/needmorecoin-advanced.ko
          nme check examples/needmorecoin-advanced.en
      - name: Run six cryptocurrency examples
        shell: bash
        run: |
          nme run examples/needmorecoin-sentence.ko
          nme run examples/needmorecoin-sentence.en
          nme run examples/needmorecoin-beginner.ko
          nme run examples/needmorecoin-beginner.en
          nme run examples/needmorecoin-advanced.ko
          nme run examples/needmorecoin-advanced.en
      - name: Commit validated documentation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- README.md README.ko.md docs/language.md docs/language.ko.md docs/guides/cryptocurrency.md docs/guides/cryptocurrency.ko.md docs/guides/example-authoring.md docs/guides/example-authoring.ko.md docs/guides/example-template.md docs/guides/example-template.ko.md
          git commit -m "docs: document pure six way cryptocurrency examples"
          git push origin HEAD:work/beta22-cryptocurrency-purity
