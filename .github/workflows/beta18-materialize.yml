name: Materialize beta.18

on:
  push:
    branches: [work/beta.18-nizk]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'beta18-run'
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v6
        with:
          ref: work/beta.18-nizk
          fetch-depth: 0
      - name: Install Rust tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install CPython
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Materialize beta.18 source
        run: python scripts/run-beta18-materializer.py
      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo run -q -p nme-cli -- run examples/zk-nizk-context.ko.nme | tee /tmp/nizk-ko.txt
          grep -F '문맥에 묶인 비대화 영지식 증명을 검증했습니다' /tmp/nizk-ko.txt
          grep -F '같은 증명은 다른 문맥으로 재사용할 수 없습니다' /tmp/nizk-ko.txt
          cargo run -q -p nme-cli -- run examples/zk-nizk-context.en.nme | tee /tmp/nizk-en.txt
          grep -F 'Context-bound non-interactive proof verified.' /tmp/nizk-en.txt
          grep -F 'The same proof was rejected under a different context.' /tmp/nizk-en.txt
          python - <<'PY'
          import tomllib
          from pathlib import Path
          v = tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version']
          assert v == '0.0.1-beta.18', v
          lock = tomllib.loads(Path('Cargo.lock').read_text(encoding='utf-8'))
          got = {p['name']: p['version'] for p in lock['package'] if p['name'] in {'nme-cli', 'nme-core', 'nme-native'}}
          assert got == {'nme-cli': v, 'nme-core': v, 'nme-native': v}, got
          PY
      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.toml Cargo.lock README.md README.ko.md docs/install.md docs/install.ko.md docs/versioning.md docs/versioning.ko.md crates/nme-cli/tests/cli.rs crates/nme-core/src/syntax.rs crates/nme-core/src/parser.rs crates/nme-core/src/lower.rs CHANGELOG.md CHANGELOG.ko.md docs/release-beta.18.md docs/zero-knowledge-nizk.md docs/zero-knowledge-nizk.ko.md examples/zk-nizk-context.ko.nme examples/zk-nizk-context.en.nme
          git diff --cached --check
          git commit -m 'release: 0.0.1-beta.18 candidate'
          git push origin HEAD:work/beta.18-nizk
