name: Repair beta.17 preparer

on:
  push:
    branches: [work/beta.17-nextgen]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/beta.17-nextgen
          fetch-depth: 0
      - name: Remove expression-looking explanatory comment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/prepare-beta17.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          lines = [line for line in lines if 'The replacement above produces' not in line and 'out of this preparation workflow' not in line]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('.github/workflows/fix-beta17-preparer.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/prepare-beta17.yml .github/workflows/fix-beta17-preparer.yml
          git diff --cached --check
          git commit -m 'chore(beta17): fix preparer expression escaping'
          git push origin HEAD:work/beta.17-nextgen
