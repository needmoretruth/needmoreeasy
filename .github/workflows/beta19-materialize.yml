name: Materialize beta.19

on:
  push:
    branches: [work/beta.19-main-ancestry]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'beta19-run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/beta.19-main-ancestry
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Materialize beta.19
        run: python scripts/materialize-beta19.py
      - name: Validate beta.19 tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python - <<'PY'
          import tomllib
          from pathlib import Path
          v = tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version']
          assert v == '0.0.1-beta.19', v
          lock = tomllib.loads(Path('Cargo.lock').read_text(encoding='utf-8'))
          got = {p['name']: p['version'] for p in lock['package'] if p['name'] in {'nme-cli','nme-core','nme-native'}}
          assert got == {'nme-cli':v,'nme-core':v,'nme-native':v}, got
          PY
      - name: Commit candidate tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.toml Cargo.lock README.md README.ko.md docs/install.md docs/install.ko.md docs/versioning.md docs/versioning.ko.md crates/nme-cli/tests/cli.rs CHANGELOG.md CHANGELOG.ko.md docs/release-beta.19.md
          git diff --cached --check
          git commit -m 'release: 0.0.1-beta.19 candidate tree'
          git push origin HEAD:work/beta.19-main-ancestry
