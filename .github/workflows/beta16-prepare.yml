name: Prepare beta.16 zero-knowledge release candidate

on:
  push:
    branches: [release/beta.16-zk]
  pull_request:
    branches: [beta]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event_name == 'push' || github.head_ref == 'release/beta.16-zk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/beta.16-zk
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Normalize one current-limit sentence for exact preparation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/language.ko.md')
          text = path.read_text(encoding='utf-8')
          old = '''- 내장 `random`과 `file` 모듈은 이번 베타에서 쉬운 모듈 문법을 제공합니다.
            다른 Python 라이브러리는 일반 `import`로 씁니다.'''
          new = '''- 내장 `random`과 `file` 모듈은 이 베타에서 쉬운 모듈 문법을 지원하며,
            다른 Python 라이브러리는 일반 `import`를 사용합니다.'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply exact release preparation
        run: python scripts/prepare_beta16_zk.py

      - name: Apply release-candidate integration fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          prime = ''
          path = Path('crates/nme-core/src/lower.rs')
          text = path.read_text(encoding='utf-8')
          pattern = r'(?m)^\s*"zk_prime = 영지식큰소수 = 0x",\n\s*SCHNORR_GROUP15_PRIME,\n\s*"; ",'
          text, count = re.subn(pattern, f'    "zk_prime = 영지식큰소수 = 0x{prime}; ",', text, count=1)
          assert count == 1
          path.write_text(text, encoding='utf-8')

          path = Path('crates/nme-native/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          pattern = r'(?ms)^(\s*)Value::RandomInteger \{ \.\. \} \| Value::RandomChoice \{ \.\. \} => \{\s*Err\(not_supported\("random values", span_of_value\(value\)\)\)\s*\}'
          match = re.search(pattern, text)
          assert match is not None
          indent = match.group(1)
          replacement = match.group(0) + '\n' + indent + 'Value::ZeroKnowledge(_) => {\n' + indent + '    Err(not_supported("zero-knowledge values", span_of_value(value)))\n' + indent + '}'
          text, count = re.subn(pattern, lambda _: replacement, text, count=1)
          assert count == 1

          pattern = r'(?ms)^(\s*)Value::Text\(_\) \| Value::Literal\(_\) \| Value::RandomInteger \{ \.\. \} \| Value::RandomChoice \{ \.\. \} => \{\s*Err\(not_supported\("this value", span_of_value\(value\)\)\)\s*\}'
          match = re.search(pattern, text)
          assert match is not None
          indent = match.group(1)
          replacement = (
              indent + 'Value::Text(_)\n'
              + indent + '| Value::Literal(_)\n'
              + indent + '| Value::RandomInteger { .. }\n'
              + indent + '| Value::RandomChoice { .. }\n'
              + indent + '| Value::ZeroKnowledge(_) => {\n'
              + indent + '    Err(not_supported("this value", span_of_value(value)))\n'
              + indent + '}'
          )
          text, count = re.subn(pattern, lambda _: replacement, text, count=1)
          assert count == 1
          path.write_text(text, encoding='utf-8')
          PY

      - name: Format Rust
        run: cargo fmt --all

      - name: Release-quality validation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo run --quiet -p nme-cli -- --version | tee /tmp/nme-version
          grep -Fx 'nme 0.0.1-beta.16' /tmp/nme-version
          cargo run --quiet -p nme-cli -- modules | tee /tmp/nme-modules
          grep -F 'zero_knowledge  0.0.1  bundled, latest' /tmp/nme-modules
          cargo run --quiet -p nme-cli -- check examples/zk-schnorr-relay.ko.nme
          cargo run --quiet -p nme-cli -- run examples/zk-schnorr-relay.ko.nme | tee /tmp/zk-ko
          grep -F '영지식 증명을 수신자 비가 받아들였습니다' /tmp/zk-ko
          grep -F '저장 전사록 재전송은 새 도전에서 실패했습니다' /tmp/zk-ko
          grep -F '비밀값 없이도 미리 고른 도전에 맞는 전사록을 모의할 수 있습니다' /tmp/zk-ko
          grep -F '모의 전사록은 수신자 비의 다른 도전에는 재사용할 수 없습니다' /tmp/zk-ko
          grep -F '실시간 중계는 통과하지만 비밀 위조가 아니라' /tmp/zk-ko
          cargo run --quiet -p nme-cli -- run examples/zk-schnorr-relay.en.nme | tee /tmp/zk-en
          grep -F "accepted sender A's zero-knowledge proof" /tmp/zk-en
          grep -F 'cannot replay the saved transcript' /tmp/zk-en
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('examples/zk-schnorr-relay.ko.nme').read_text(encoding='utf-8')
          assert re.search(r'[A-Za-z]', text) is None, 'Korean sentence-only example contains ASCII letters'
          PY
          if git grep -n '0.0.1-beta.15' -- ':!CHANGELOG.md' ':!CHANGELOG.ko.md'; then
            echo 'stale beta.15 version outside changelog' >&2
            exit 1
          fi
          git diff --check

      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -- scripts/prepare_beta16_zk.py .github/workflows/beta16-prepare.yml
          echo 'Validated diff:'
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r file; do
            [ -n "$file" ] && git add -- "$file"
          done < <(git diff --name-only)
          while IFS= read -r file; do
            [ -n "$file" ] && git add -- "$file"
          done < <(git ls-files --others --exclude-standard)
          git diff --cached --check
          git commit -m 'Prepare 0.0.1-beta.16 release candidate [beta16-applied]'
          git push origin HEAD:release/beta.16-zk
