name: NME CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: write

jobs:
  prepare-windows-native-artifact:
    name: prepare-windows-native-artifact
    if: github.event_name == 'pull_request' && github.head_ref == 'release/beta.16-zk'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release candidate branch
        uses: actions/checkout@v4
        with:
          ref: release/beta.16-zk
          fetch-depth: 0

      - name: Install stable Rust with required tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install CPython
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Normalize Windows native executable paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          main = Path('crates/nme-cli/src/main.rs')
          text = main.read_text(encoding='utf-8')

          text, changed = re.subn(
              r'(?m)^    let exe = dir\.join\(stem\);$',
              '    let mut exe = dir.join(stem);\n'
              '    if cfg!(windows) {\n'
              '        exe.set_extension("exe");\n'
              '    }',
              text,
              count=1,
          )
          assert changed == 1, 'temporary native executable path'

          text, changed = re.subn(
              r'(?m)^(    if action == "build" \{\n)'
              r'(        let out = output\.map_or_else\(\|\| PathBuf::from\(stem\), PathBuf::from\);\n)'
              r'(        let copy_exe = std::fs::copy\(&exe, &out\)\.is_ok\(\);)',
              r'\1'
              '        let mut out = output.map_or_else(|| PathBuf::from(stem), PathBuf::from);\n'
              '        if cfg!(windows) && out.extension().is_none() {\n'
              '            out.set_extension("exe");\n'
              '        }\n'
              r'\3',
              text,
              count=1,
          )
          assert changed == 1, 'native build output path'
          main.write_text(text, encoding='utf-8')

          tests = Path('crates/nme-cli/tests/cli.rs')
          text = tests.read_text(encoding='utf-8')
          text, changed = re.subn(
              r'(?m)^    assert!\(dir\.join\("count_out"\)\.exists\(\), "no executable written"\);$',
              '    let executable = if cfg!(windows) {\n'
              '        dir.join("count_out.exe")\n'
              '    } else {\n'
              '        dir.join("count_out")\n'
              '    };\n'
              '    assert!(executable.exists(), "no executable written");',
              text,
              count=1,
          )
          assert changed == 1, 'native artifact assertion'
          tests.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Commit validated Windows native artifact fix
        shell: bash
        run: |
          set -euo pipefail
          git checkout c336f92f8ae538f41cb03dbf52edd820cd992a13 -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/ci.yml crates/nme-cli/src/main.rs crates/nme-cli/tests/cli.rs
          git diff --cached --check
          git commit -m 'Fix Windows native artifact suffix handling [beta16-applied]'
          git push origin HEAD:release/beta.16-zk

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out NME
        uses: actions/checkout@v4

      - name: Install stable Rust with required tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install CPython
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Install the CLI and smoke test it
        shell: bash
        run: |
          cargo install --path crates/nme-cli --locked
          nme --version
          nme check examples/three-levels
          nme run examples/hello-sentence
