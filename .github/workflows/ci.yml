name: NME CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: write

jobs:
  prepare-windows-portability:
    name: prepare-windows-portability
    if: github.event_name == 'pull_request' && github.head_ref == 'release/beta.16-zk'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release candidate branch
        uses: actions/checkout@v4
        with:
          ref: release/beta.16-zk
          fetch-depth: 0

      - name: Install stable Rust with required tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install CPython
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Make CPython execution and CLI tests portable on Windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          exec_path = Path('crates/nme-cli/src/exec.rs')
          text = exec_path.read_text(encoding='utf-8')

          text, changed = re.subn(
              r'(?m)^    let mut child = Command::new\(python\)\n        \.arg\("-c"\)\n        \.arg\(CHECK_BOOTSTRAP\)',
              '    let mut command = Command::new(python);\n'
              '    configure_python_utf8(&mut command);\n'
              '    let mut child = command\n'
              '        .arg("-c")\n'
              '        .arg(CHECK_BOOTSTRAP)',
              text,
              count=1,
          )
          assert changed == 1, 'check_python command shape'

          text, changed = re.subn(
              r'(?m)^(    let mut command = Command::new\(python\);\n)(    if let Some\(dir\) = module_dir \{)',
              r'\1    configure_python_utf8(&mut command);\n\2',
              text,
              count=1,
          )
          assert changed == 1, 'run_python command shape'

          text, changed = re.subn(
              r'(?m)^    let status = Command::new\(python\)\n        \.arg\("-m"\)',
              '    let mut command = Command::new(python);\n'
              '    configure_python_utf8(&mut command);\n'
              '    let status = command\n'
              '        .arg("-m")',
              text,
              count=1,
          )
          assert changed == 1, 'compile_native command shape'

          boundary = 'fn stop_after_input_error(child: &mut std::process::Child) {'
          helper = '''fn configure_python_utf8(command: &mut Command) {
              command
                  .env("PYTHONUTF8", "1")
                  .env("PYTHONIOENCODING", "utf-8");
          }

          fn stop_after_input_error(child: &mut std::process::Child) {'''
          assert text.count(boundary) == 1
          text = text.replace(boundary, helper, 1)
          exec_path.write_text(text, encoding='utf-8')

          tests = Path('crates/nme-cli/tests/cli.rs')
          text = tests.read_text(encoding='utf-8')
          assert text.count('String::from_utf8_lossy(&output.stdout).into_owned()') == 1
          assert text.count('String::from_utf8_lossy(&output.stderr).into_owned()') == 1
          text = text.replace(
              'String::from_utf8_lossy(&output.stdout).into_owned()',
              'String::from_utf8_lossy(&output.stdout).replace("\\r\\n", "\\n")',
              1,
          )
          text = text.replace(
              'String::from_utf8_lossy(&output.stderr).into_owned()',
              'String::from_utf8_lossy(&output.stderr).replace("\\r\\n", "\\n")',
              1,
          )

          marker = '    let built = nme(&[\n        "b",\n'
          assert text.count(marker) == 1
          text = text.replace(
              marker,
              '    let build_dir = temporary_dir("build-alias");\n'
              '    let build_path = build_dir.join("nme-build-alias-test.py");\n'
              + marker,
              1,
          )
          assert text.count('        "/tmp/nme-build-alias-test.py",') == 1
          text = text.replace(
              '        "/tmp/nme-build-alias-test.py",',
              '        &build_path.to_string_lossy(),',
              1,
          )
          built_assert = '    assert!(built.status.success(), "{}", stderr(&built));'
          assert text.count(built_assert) >= 1
          built_at = text.index(built_assert, text.index('let build_path'))
          insert_at = built_at + len(built_assert)
          text = text[:insert_at] + '\n    let _ = std::fs::remove_dir_all(&build_dir);' + text[insert_at:]

          assert text.count('    let output_file = dir.join("already-here");') == 1
          text = text.replace(
              '    let output_file = dir.join("already-here");',
              '    let output_file = dir.join("already-here.exe");',
              1,
          )
          tests.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Commit validated Windows portability fixes
        shell: bash
        run: |
          set -euo pipefail
          git checkout 6b77e1b0f74ccfb32b2ecfef781f09ac82ed52e9 -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/ci.yml crates/nme-cli/src/exec.rs crates/nme-cli/tests/cli.rs
          git diff --cached --check
          git commit -m 'Fix Windows UTF-8 execution and portable CLI tests [beta16-applied]'
          git push origin HEAD:release/beta.16-zk

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out NME
        uses: actions/checkout@v4

      - name: Install stable Rust with required tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install CPython
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Install the CLI and smoke test it
        shell: bash
        run: |
          cargo install --path crates/nme-cli --locked
          nme --version
          nme check examples/three-levels
          nme run examples/hello-sentence
