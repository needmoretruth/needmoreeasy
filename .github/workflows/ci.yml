name: NME CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  beta-step:
    name: beta-version-step
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    steps:
      - name: Check out NME with its parent
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Install CPython
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Enforce one beta version per beta commit
        run: python scripts/check-beta-step.py

  docs:
    name: documentation-parity
    runs-on: ubuntu-latest
    steps:
      - name: Check out NME
        uses: actions/checkout@v6
      - name: Install CPython
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check Korean and English documentation parity
        run: python scripts/check-doc-parity.py
      - name: Check the syntax list against the compiler
        run: python scripts/check-syntax-reference.py

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out NME
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Install stable Rust with required tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set up the MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install CPython
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Format
        if: github.event_name != 'pull_request'
        run: cargo fmt --all -- --check
      - name: Format pull request changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- '*.rs')
          if [ -z "$files" ]; then
            exit 0
          fi
          while IFS= read -r file; do
            rustfmt --check --edition 2021 "$file"
          done <<< "$files"
      - name: Check
        run: cargo check --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Install the CLI and smoke test it (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo install --path crates/nme-cli --locked
          nme --version
          nme check examples/three-levels
          nme run examples/hello-sentence
      - name: Compile every documented row and every guide program
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --release -p nme-cli --locked
          python scripts/check-syntax-reference.py
          python scripts/check-guide-code.py
          python scripts/check-guide-silent.py
          python scripts/check-guide-index.py
          python scripts/check-guide-output.py
          python scripts/check-tier-parity.py
      # A program that fails to compile announces itself; one that compiles into
      # a different program does not. These two guard the quiet half: thirty
      # ordinary sentences must print themselves, and no documented line may
      # drift into an assignment.
      - name: Check that ordinary sentences still print themselves
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/mistake-probes/prose_corpus.py
          python scripts/check-prose-blocks.py
          python scripts/mistake-probes/english_prose.py
          python scripts/mistake-probes/korean_prose.py
      - name: Install the CLI and smoke test it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --path crates/nme-cli --locked
          nme --version
          nme check examples/three-levels
          nme run examples/hello-sentence

  python-compat:
    name: python-${{ matrix.python-version }}
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - name: Check out NME
        uses: actions/checkout@v6
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install CPython ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test the workspace on this CPython
        run: cargo test --workspace --locked
