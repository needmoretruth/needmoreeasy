name: Prepare beta.17 candidate

on:
  push:
    branches: [work/beta.17-nextgen]

permissions:
  contents: write

jobs:
  materialize:
    if: contains(github.event.head_commit.message, 'chore(beta17): launch materializer')
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta.17 work branch
        uses: actions/checkout@v6
        with:
          ref: work/beta.17-nextgen
          fetch-depth: 0

      - name: Install stable Rust with required tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install CPython
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Materialize and validate beta.17
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = "0.0.1-beta.16"
          new = "0.0.1-beta.17"
          version_files = [
              Path("Cargo.toml"),
              Path("Cargo.lock"),
              Path("README.md"),
              Path("README.ko.md"),
              Path("docs/install.md"),
              Path("docs/install.ko.md"),
              Path("docs/versioning.md"),
              Path("docs/versioning.ko.md"),
              Path("crates/nme-cli/tests/cli.rs"),
          ]
          changed = []
          for path in version_files:
              text = path.read_text(encoding="utf-8")
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  changed.append(str(path))
          assert "Cargo.toml" in changed, changed
          assert "Cargo.lock" in changed, changed
          assert "crates/nme-cli/tests/cli.rs" in changed, changed

          scripts = Path("scripts")
          scripts.mkdir(exist_ok=True)
          Path("scripts/check-beta-step.py").write_text(r'''#!/usr/bin/env python3
"""Enforce the public beta invariant: every beta commit advances exactly one beta."""
from __future__ import annotations

import re
import subprocess
import sys
import tomllib
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
VERSION_RE = re.compile(r"^(?P<base>.+-beta\.)(?P<number>\d+)$")


def fail(message: str) -> None:
    print(f"beta-step: {message}", file=sys.stderr)
    raise SystemExit(1)


def manifest_version(text: str) -> str:
    data = tomllib.loads(text)
    try:
        return data["workspace"]["package"]["version"]
    except KeyError as error:
        fail(f"Cargo.toml has no workspace.package.version: {error}")


def git(*args: str) -> str:
    return subprocess.check_output(["git", *args], cwd=ROOT, text=True).strip()


current = manifest_version((ROOT / "Cargo.toml").read_text(encoding="utf-8"))
match = VERSION_RE.fullmatch(current)
if not match:
    fail(f"current version is not a beta version: {current}")

try:
    parent_manifest = git("show", "HEAD^:Cargo.toml")
except subprocess.CalledProcessError:
    fail("beta commit needs a first parent with Cargo.toml")
parent = manifest_version(parent_manifest)
parent_match = VERSION_RE.fullmatch(parent)
if not parent_match:
    fail(f"parent version is not a beta version: {parent}")
if match.group("base") != parent_match.group("base"):
    fail(f"beta base changed unexpectedly: {parent} -> {current}")
if int(match.group("number")) != int(parent_match.group("number")) + 1:
    fail(f"beta must advance exactly one step: {parent} -> {current}")

subject = git("log", "-1", "--format=%s")
if current not in subject:
    fail(f"commit subject must contain {current!r}: {subject!r}")

lock = tomllib.loads((ROOT / "Cargo.lock").read_text(encoding="utf-8"))
workspace_packages = {"nme-cli", "nme-core", "nme-native"}
seen = set()
for package in lock.get("package", []):
    name = package.get("name")
    if name in workspace_packages:
        seen.add(name)
        if package.get("version") != current:
            fail(f"Cargo.lock {name} is {package.get('version')}, expected {current}")
if seen != workspace_packages:
    fail(f"Cargo.lock workspace packages mismatch: {sorted(seen)}")

print(f"beta-step: ok {parent} -> {current}")
''', encoding="utf-8")

          en = Path("CHANGELOG.md")
          marker = "## Unreleased\n"
          entry = '''\n## 0.0.1-beta.17 — 2026-08-12\n\n- Make `beta` the enforced next-generation release line. Every public beta push now has to advance the workspace beta number by exactly one, include that version in the commit subject, and keep all workspace package versions in `Cargo.lock` synchronized.\n- Upgrade CI to the Node 24 based `actions/checkout@v6` and `actions/setup-python@v6`, and make Cargo checks/tests run with `--locked`.\n- Add a CPython compatibility matrix for 3.10, 3.12, and 3.14 on beta/PR validation, while retaining the full Ubuntu/Windows/macOS quality gate.\n'''
          text = en.read_text(encoding="utf-8")
          assert marker in text and "## 0.0.1-beta.17" not in text
          en.write_text(text.replace(marker, marker + entry, 1), encoding="utf-8")

          ko = Path("CHANGELOG.ko.md")
          marker_ko = "## 미출시 (Unreleased)\n"
          entry_ko = '''\n## 0.0.1-beta.17 — 2026-08-12\n\n- `beta`를 규칙으로 강제되는 차세대 릴리스 선으로 만들었습니다. 공개 beta push마다 workspace beta 번호가 부모보다 정확히 1 증가해야 하고, 커밋 제목에 그 버전이 들어가며, `Cargo.lock`의 모든 workspace 패키지 버전도 일치해야 합니다.\n- CI를 Node 24 기반 `actions/checkout@v6`, `actions/setup-python@v6`로 올리고 Cargo 검사와 테스트에 `--locked`를 적용했습니다.\n- beta/PR 검증에 CPython 3.10, 3.12, 3.14 호환성 매트릭스를 추가하면서 Ubuntu/Windows/macOS 전체 품질 게이트도 유지합니다.\n'''
          text = ko.read_text(encoding="utf-8")
          assert marker_ko in text and "## 0.0.1-beta.17" not in text
          ko.write_text(text.replace(marker_ko, marker_ko + entry_ko, 1), encoding="utf-8")

          Path("docs/release-beta.17.md").write_text('''# NME 0.0.1-beta.17\n\n`beta` is now the repository's next-generation release line rather than a staging copy of another branch.\n\n## Release invariants\n\n- Every commit that lands on public `beta` must move from `beta.N` to exactly `beta.N+1`.\n- The release commit subject must name the exact workspace version.\n- `Cargo.toml` and the `nme-cli`, `nme-core`, and `nme-native` entries in `Cargo.lock` must agree.\n- The beta gate checks the real first parent rather than trusting a manually supplied number.\n\n## Compatibility gate\n\nThe normal release gate still runs format, check, Clippy with warnings denied, the full workspace test suite, CLI installation, and smoke tests on Ubuntu, Windows, and macOS. Beta and pull requests also exercise the workspace against CPython 3.10, 3.12, and 3.14.\n\nThe GitHub-maintained checkout and Python setup actions use their Node 24 based v6 lines.\n''', encoding="utf-8")
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

          python - <<'PY'
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version']
          assert version == '0.0.1-beta.17', version
          lock = tomllib.loads(Path('Cargo.lock').read_text(encoding='utf-8'))
          versions = {p['name']: p['version'] for p in lock['package'] if p['name'] in {'nme-cli','nme-core','nme-native'}}
          assert versions == {'nme-cli':'0.0.1-beta.17','nme-core':'0.0.1-beta.17','nme-native':'0.0.1-beta.17'}, versions
          print('validated', version, versions)
          PY

      - name: Commit validated non-workflow candidate files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.toml Cargo.lock README.md README.ko.md docs/install.md docs/install.ko.md docs/versioning.md docs/versioning.ko.md crates/nme-cli/tests/cli.rs CHANGELOG.md CHANGELOG.ko.md docs/release-beta.17.md scripts/check-beta-step.py
          git diff --cached --check
          git commit -m 'release: 0.0.1-beta.17 candidate'
          git push origin HEAD:work/beta.17-nextgen
