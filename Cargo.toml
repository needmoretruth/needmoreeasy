[workspace]
resolver = "2"
members = ["crates/nme-core", "crates/nme-cli", "crates/nme-native"]

[workspace.package]
version = "0.0.1-beta.15"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/needmoretruth/needmoreeasy"
homepage = "https://github.com/needmoretruth/needmoreeasy"
description = "NeedMoreEasy (NME): a language easier than Python, compatible with Python."

# Project-wide rule: NME's own code never uses `unsafe`.
# (This lint applies to workspace crates only, not to dependencies.)
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Too noisy for this codebase; clarity is enforced by review instead.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
# Our docs mention CPython/RustPython/NeedMoreEasy constantly; these are
# proper names, not code items, so backticks would be wrong.
doc_markdown = "allow"
